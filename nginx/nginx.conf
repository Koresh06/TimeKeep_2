server {
    listen 80;
    server_name 24timekeep.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 24timekeep.ru;

    ssl_certificate /etc/letsencrypt/live/24timekeep.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/24timekeep.ru/privkey.pem;

    location /api {
        proxy_pass http://timekeep_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://timekeep_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}