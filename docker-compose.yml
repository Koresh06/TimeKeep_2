services:

  db:
    image: postgres:16
    container_name: timekeep_db
    env_file:
      - ./backend/.env.db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timekeep_redis
    restart: always

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timekeep_app
    command: sh -c "alembic upgrade head && uvicorn src.presentation.app:create_app --host 0.0.0.0 --port 8000 --factory"
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timekeep_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
