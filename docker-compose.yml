services:

  db:
    image: postgres:16
    container_name: timekeep_db
    environment:
      POSTGRES_USER: ${APP_CONFIG__DB__USER}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__PASSWORD}
      POSTGRES_DB: ${APP_CONFIG__DB__NAME}
    env_file:
      - ./backend/.env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timekeep_redis
    restart: always

  backend:
    build:
      context: ./backend
    container_name: timekeep_backend
    command: sh -c "alembic upgrade head && uvicorn src.presentation.app:create_app --host 0.0.0.0 --port 8080 --factory"
    env_file:
      - ./backend/.env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      network: host
    container_name: timekeep_frontend
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: timekeep_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config: